<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b3b3b"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#3b3b3b; stroke-width:1.4; rx:6; }
    .mod { fill:#eef4ff; stroke:#1f6feb; stroke-width:1.6; rx:6; }
    .ext { fill:#fff8e6; stroke:#b8860b; stroke-width:1.4; rx:6; stroke-dasharray:5 3; }
    .t { fill:#1f1f1f; }
    .h { fill:#1f1f1f; font-weight:600; font-size:14px; }
    .s { fill:#555; font-size:12px; }
    .l { fill:#3b3b3b; font-size:12px; }
    .lb { fill:#1f6feb; font-size:12px; }
    .arrow { stroke:#3b3b3b; stroke-width:1.4; fill:none; marker-end:url(#a); }
    .arrowb { stroke:#1f6feb; stroke-width:1.4; fill:none; marker-end:url(#ab); stroke-dasharray:5 4; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; fill:#1f1f1f; }
  </style>
  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>
  <text x="20" y="30" class="h" font-size="16">peek — one call, exactly what was asked for</text>

  <!-- agent -->
  <rect x="20" y="70" width="170" height="70" class="box"/>
  <text x="105" y="97" text-anchor="middle" class="h">coding agent</text>
  <text x="105" y="116" text-anchor="middle" class="s">Claude Code, Codex, …</text>
  <text x="105" y="131" text-anchor="middle" class="s">via Bash</text>

  <!-- cli -->
  <rect x="260" y="70" width="200" height="70" class="mod"/>
  <text x="360" y="92" text-anchor="middle" class="h">peek (main)</text>
  <text x="360" y="109" text-anchor="middle" class="s">parses args, picks the command,</text>
  <text x="360" y="124" text-anchor="middle" class="s">errors say what to run instead</text>
  <line x1="190" y1="105" x2="258" y2="105" class="arrow"/>
  <text x="224" y="95" text-anchor="middle" class="l">argv</text>

  <!-- commands -->
  <rect x="530" y="60" width="150" height="40" class="box"/>
  <text x="605" y="79" text-anchor="middle" class="t">peek &lt;file&gt; …</text>
  <text x="605" y="93" text-anchor="middle" class="s">view · outline</text>
  <rect x="530" y="108" width="150" height="40" class="box"/>
  <text x="605" y="127" text-anchor="middle" class="t">peek outline</text>
  <text x="605" y="141" text-anchor="middle" class="s">outline</text>
  <rect x="530" y="156" width="150" height="40" class="box"/>
  <text x="605" y="175" text-anchor="middle" class="t">peek grep</text>
  <text x="605" y="189" text-anchor="middle" class="s">search · outline · view</text>
  <rect x="530" y="204" width="150" height="40" class="box"/>
  <text x="605" y="223" text-anchor="middle" class="t">peek tree</text>
  <text x="605" y="237" text-anchor="middle" class="s">search</text>
  <path d="M460,105 L495,105 L495,80 L528,80" class="arrow"/>
  <path d="M495,105 L495,128 L528,128" class="arrow"/>
  <path d="M495,128 L495,176 L528,176" class="arrow"/>
  <path d="M495,176 L495,224 L528,224" class="arrow"/>

  <!-- modules -->
  <rect x="760" y="60" width="260" height="60" class="mod"/>
  <text x="890" y="82" text-anchor="middle" class="h">view</text>
  <text x="890" y="99" text-anchor="middle" class="s">windows → numbered lines, clipping,</text>
  <text x="890" y="113" text-anchor="middle" class="s">gap markers, header / footer</text>

  <rect x="760" y="140" width="260" height="76" class="mod"/>
  <text x="890" y="162" text-anchor="middle" class="h">outline</text>
  <text x="890" y="179" text-anchor="middle" class="s">Almide parser · rule table for Rust, Go,</text>
  <text x="890" y="193" text-anchor="middle" class="s">TS/JS, Python · brace / indent ranges</text>
  <text x="890" y="207" text-anchor="middle" class="s">find(name) · enclosing(line)</text>

  <rect x="760" y="236" width="260" height="60" class="mod"/>
  <text x="890" y="258" text-anchor="middle" class="h">search</text>
  <text x="890" y="275" text-anchor="middle" class="s">walk (skips vcs / build / deps / binaries),</text>
  <text x="890" y="289" text-anchor="middle" class="s">fold identical lines, cap, name the symbol</text>

  <path d="M680,152 L720,152 L720,90 L758,90" class="arrow"/>
  <path d="M720,152 L720,178 L758,178" class="arrow"/>
  <path d="M720,178 L720,266 L758,266" class="arrow"/>
  <text x="700" y="145" text-anchor="middle" class="l">uses</text>

  <!-- helper -->
  <rect x="760" y="320" width="260" height="56" class="ext"/>
  <text x="890" y="342" text-anchor="middle" class="h">ctxgate-outline  (optional)</text>
  <text x="890" y="360" text-anchor="middle" class="s">tree-sitter, used when on PATH</text>
  <path d="M1020,200 L1050,200 L1050,348 L1022,348" class="arrowb"/>
  <text x="1056" y="270" class="lb" text-anchor="start">rs go</text>
  <text x="1056" y="284" class="lb" text-anchor="start">ts py</text>

  <!-- output -->
  <rect x="20" y="200" width="440" height="200" class="box"/>
  <text x="32" y="222" class="h">what comes back</text>
  <text x="32" y="246" class="mono"># src/cmds/git/git.rs  (4720 lines, 168 KB)</text>
  <text x="32" y="264" class="mono">       ⋮  (647 lines)</text>
  <text x="32" y="282" class="mono">     ── fn compact_diff ──</text>
  <text x="32" y="300" class="mono"> 648│ pub fn compact_diff(input: &amp;str, opts: &amp;DiffOpts) {</text>
  <text x="32" y="318" class="mono"> 649│     let mut out = String::new();</text>
  <text x="32" y="336" class="mono"> …</text>
  <text x="32" y="354" class="mono">       ⋮  (3899 lines)</text>
  <text x="32" y="372" class="mono"># shown: 174 lines, 6 KB</text>
  <path d="M105,140 L105,198" class="arrow" transform="scale(1,-1) translate(0,-338)"/>
  <text x="120" y="172" class="l">numbered, sized,</text>
  <text x="120" y="187" class="l">nothing withheld</text>

  <!-- principles -->
  <text x="20" y="440" class="h">rules</text>
  <text x="20" y="462" class="s">1. Return exactly what was asked. No summary, no budget — the model decides what it needs.</text>
  <text x="20" y="480" class="s">2. Every line is numbered so the next call can be `--lines A-B`. Gaps say how many lines were skipped.</text>
  <text x="20" y="498" class="s">3. Say where things are: the header has the file size, grep hits name their enclosing symbol, `--symbol` errors suggest names.</text>
  <text x="20" y="516" class="s">4. Bounded output: clipped lines, per-file and total caps on grep, 40 files per directory in tree.</text>
  <text x="20" y="540" class="s">ctxgate (github.com/O6lvl4/ctxgate) works on the output side of a tool call; peek is the input side. Use both.</text>
</svg>
