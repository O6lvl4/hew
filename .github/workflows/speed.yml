name: Speed (rc3 vs rc4)
# Temporary: the same hew source built by almide v0.69.0-rc3 (main) and by
# v0.69.0-rc4 (this branch), both `almide build --release` with rustc 1.97.0,
# timed in alternating order on one runner over the almide repo.
on:
  push:
    branches: [ci-almide-rc4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: new, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: 7b00c80ae5f7d9606d3df7cf18a9f78b86810734, path: old, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: almide/almide, ref: 3e78b9b6000a3d668d7102b8c7ffa99efeef871f, path: .ci/almide-old, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: almide/almide, ref: f78ac5b07668b46859fa03b8d2282b53e629a58c, path: .ci/almide-new, persist-credentials: false }
      - run: rustup toolchain install 1.94.0 --profile minimal && rustup toolchain install 1.97.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: old-compiler
        with:
          path: .ci/almide-old/target/release/almide
          key: almide-${{ runner.os }}-3e78b9b6000a3d668d7102b8c7ffa99efeef871f-rust1.97.0
      - if: steps.old-compiler.outputs.cache-hit != 'true'
        run: RUSTUP_TOOLCHAIN=1.97.0 cargo build --release --locked --bin almide --manifest-path .ci/almide-old/Cargo.toml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: new-compiler
        with:
          path: .ci/almide-new/target/release/almide
          key: almide-${{ runner.os }}-f78ac5b07668b46859fa03b8d2282b53e629a58c-rust1.97.0
      - if: steps.new-compiler.outputs.cache-hit != 'true'
        run: RUSTUP_TOOLCHAIN=1.97.0 cargo build --release --locked --bin almide --manifest-path .ci/almide-new/Cargo.toml
      - name: Build both hews
        run: |
          (cd old && RUSTUP_TOOLCHAIN=1.97.0 ../.ci/almide-old/target/release/almide build --release && ls -l hew)
          (cd new && RUSTUP_TOOLCHAIN=1.97.0 ../.ci/almide-new/target/release/almide build --release && ls -l hew)
      - name: Time them
        run: python3 new/bench/old_vs_new.py old/hew new/hew .ci/almide-new
